name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Organize LeetCode folders
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "🚀 LeetCode Topic Organizer"
          echo "=========================================="

          # --------------------------------------------------
          # Function: Get LeetCode tags
          # --------------------------------------------------

          get_tags() {

            local slug="$1"

            echo "🔎 Fetching LeetCode tags for: $slug"

            response=$(curl -s \
              -X POST \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Referer: https://leetcode.com/problems/$slug/" \
              https://leetcode.com/graphql \
              --data "{\"query\":\"query questionTags(\$titleSlug: String!) { question(titleSlug: \$titleSlug) { topicTags { name slug } } }\",\"variables\":{\"titleSlug\":\"$slug\"}}")

            echo "$response" |
              jq -r '.data.question.topicTags[]?.slug' |
              tr '[:upper:]' '[:lower:]'
          }


          # --------------------------------------------------
          # Function: Decide folder from LeetCode tags
          # --------------------------------------------------

          get_topic() {

            local tags="$1"

            # Highest priority topics first

            if echo "$tags" | grep -Eq 'backtracking'; then
              echo "Backtracking"
              return
            fi

            if echo "$tags" | grep -Eq 'dynamic-programming'; then
              echo "DP"
              return
            fi

            if echo "$tags" | grep -Eq 'binary-search'; then
              echo "Binary Search"
              return
            fi

            if echo "$tags" | grep -Eq 'graph'; then
              echo "Graphs"
              return
            fi

            if echo "$tags" | grep -Eq 'depth-first-search|breadth-first-search|union-find'; then
              echo "Graphs"
              return
            fi

            if echo "$tags" | grep -Eq 'binary-tree|tree|binary-search-tree'; then
              echo "Trees"
              return
            fi

            if echo "$tags" | grep -Eq 'linked-list'; then
              echo "LinkedList"
              return
            fi

            if echo "$tags" | grep -Eq 'stack'; then
              echo "Stack"
              return
            fi

            if echo "$tags" | grep -Eq 'queue|monotonic-queue'; then
              echo "Queue"
              return
            fi

            if echo "$tags" | grep -Eq 'heap|priority-queue'; then
              echo "Heap"
              return
            fi

            if echo "$tags" | grep -Eq 'trie'; then
              echo "Trie"
              return
            fi

            if echo "$tags" | grep -Eq 'greedy'; then
              echo "Greedy"
              return
            fi

            if echo "$tags" | grep -Eq 'bit-manipulation'; then
              echo "Bit Manipulation"
              return
            fi

            if echo "$tags" | grep -Eq 'string'; then
              echo "Strings"
              return
            fi

            if echo "$tags" | grep -Eq 'array'; then
              echo "Arrays"
              return
            fi

            if echo "$tags" | grep -Eq 'math|number-theory|geometry'; then
              echo "Math"
              return
            fi

            # Default
            echo "Miscellaneous"
          }


          # --------------------------------------------------
          # Search root folders
          # --------------------------------------------------

          echo ""
          echo "📂 Searching for new LeetCode folders..."
          echo ""

          find . -maxdepth 1 -mindepth 1 -type d \
            ! -name ".git" \
            ! -name ".github" |
          while read -r folder; do

            folder_name=$(basename "$folder")

            # Only process folders like:
            #
            # 0047-permutations-ii
            # 0200-number-of-islands
            # 0070-climbing-stairs
            #

            if [[ ! "$folder_name" =~ ^[0-9]{4}- ]]; then
              continue
            fi

            echo "------------------------------------------"
            echo "📁 Found: $folder_name"

            # Remove question number
            slug="${folder_name#[0-9][0-9][0-9][0-9]-}"

            echo "🔗 Slug: $slug"

            # Get LeetCode tags
            tags=$(get_tags "$slug")

            if [ -z "$tags" ]; then
              echo "⚠️ Could not fetch LeetCode tags."
              echo "➡️ Skipping this folder."
              continue
            fi

            echo ""
            echo "🏷️ LeetCode tags:"
            echo "$tags"

            # Decide topic
            topic=$(get_topic "$tags")

            echo ""
            echo "🎯 Selected topic: $topic"

            # Destination
            destination="$topic/$folder_name"

            # Already organized?
            if [ -d "$destination" ]; then
              echo "✅ Already organized."
              continue
            fi

            echo ""
            echo "📦 Moving:"
            echo "   $folder_name"
            echo "   ↓"
            echo "   $destination"

            mkdir -p "$topic"

            mv "$folder" "$destination"

            echo "✅ Moved successfully."

          done


          echo ""
          echo "=========================================="
          echo "🎉 Organization finished"
          echo "=========================================="


      # --------------------------------------------------
      # Commit changes
      # --------------------------------------------------

      - name: Commit organized folders
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "ℹ️ No changes."
            exit 0
          fi

          git add -A

          git commit -m "Organize LeetCode solutions by topic"

          git push
