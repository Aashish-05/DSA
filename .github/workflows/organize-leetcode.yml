name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize LeetCode folders
        shell: bash
        run: |
          set -e

          echo "🔍 Searching for LeetHub problem folders..."

          # Topic priority.
          # If a problem has multiple topics, the first matching
          # topic below will be used.
          declare -A TOPICS=(
            [dynamic-programming]="DP"
            [backtracking]="Backtracking"
            [recursion]="Recursion"
            [graph]="Graphs"
            [tree]="Trees"
            [linked-list]="LinkedList"
            [array]="Arrays"
            [string]="Strings"
            [binary-search]="BinarySearch"
            [greedy]="Greedy"
            [stack]="Stack"
            [queue]="Queue"
            [hash-table]="HashTable"
            [heap]="Heap"
            [math]="Math"
            [sorting]="Sorting"
            [two-pointers]="TwoPointers"
            [sliding-window]="SlidingWindow"
          )

          # Only process folders that look like LeetHub folders:
          # 0001-two-sum
          # 0047-permutations-ii
          # 0123-best-time-to-buy-and-sell-stock-iii
          for DIR in */; do

            DIR="${DIR%/}"

            if [[ "$DIR" =~ ^[0-9]{4}- ]]; then

              echo ""
              echo "========================================"
              echo "📁 Found: $DIR"
              echo "========================================"

              # Extract LeetCode slug.
              SLUG=$(echo "$DIR" | sed -E 's/^[0-9]{4}-//')

              echo "🔎 LeetCode slug: $SLUG"

              # Get LeetCode topic information.
              RESPONSE=$(curl -s \
                -A "Mozilla/5.0" \
                -H "Content-Type: application/json" \
                --data "{\"query\":\"query questionData(\\$titleSlug: String!) { question(titleSlug: \\$titleSlug) { questionFrontendId topicTags { name slug } } }\",\"variables\":{\"titleSlug\":\"$SLUG\"}}" \
                https://leetcode.com/graphql/)

              # Check whether LeetCode returned a valid question.
              QUESTION=$(echo "$RESPONSE" | jq -r '.data.question // empty')

              if [[ -z "$QUESTION" ]]; then
                echo "⚠️ Could not find LeetCode problem for $SLUG"
                echo "Skipping..."
                continue
              fi

              # Get topic slugs.
              TAGS=$(echo "$RESPONSE" | jq -r '.data.question.topicTags[].slug')

              echo "🏷️ Topics:"
              echo "$TAGS"

              TARGET=""

              # Find first matching topic based on priority.
              for TAG in "${!TOPICS[@]}"; do
                if echo "$TAGS" | grep -qx "$TAG"; then
                  TARGET="${TOPICS[$TAG]}"
                  break
                fi
              done

              if [[ -z "$TARGET" ]]; then
                echo "⚠️ No mapped topic found."
                echo "Leaving $DIR where it is."
                continue
              fi

              echo "📌 Target folder: $TARGET"

              # Create topic folder if necessary.
              mkdir -p "$TARGET"

              # Don't move if already inside a topic folder.
              if [[ "$DIR" == "$TARGET/"* ]]; then
                echo "Already organized."
                continue
              fi

              # Avoid overwriting an existing solution.
              if [[ -e "$TARGET/$DIR" ]]; then
                echo "⚠️ $TARGET/$DIR already exists."
                echo "Skipping to avoid overwriting."
                continue
              fi

              echo "🚚 Moving:"
              echo "   $DIR"
              echo "   → $TARGET/$DIR"

              git mv "$DIR" "$TARGET/$DIR"

            fi
          done

      - name: Commit organized folders
        shell: bash
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "✅ Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Organize LeetCode solutions by topic"

          git push
